<svg viewBox="0 0 980 560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00b0ff"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="560" fill="#121212"/>

  <text x="490" y="36" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700">
    Anomaly Detection Pipeline — anomaly_engine.py
  </text>

  <!-- Step 1: Input -->
  <rect x="40" y="70" width="220" height="70" rx="8" fill="#1e1e1e" stroke="#333333"/>
  <text x="150" y="96" text-anchor="middle" fill="#e1e1e1" font-size="13" font-weight="700">20-Day Volume History</text>
  <text x="150" y="116" text-anchor="middle" fill="#aaaaaa" font-size="11">Volume(t-20) ... Volume(t-1)</text>

  <!-- Arrow to baseline -->
  <line x1="150" y1="140" x2="150" y2="185" stroke="#00b0ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: Median baseline -->
  <rect x="40" y="188" width="220" height="70" rx="8" fill="#1e1e1e" stroke="#00e676"/>
  <text x="150" y="212" text-anchor="middle" fill="#00e676" font-size="13" font-weight="700">Median Baseline</text>
  <text x="150" y="232" text-anchor="middle" fill="#aaaaaa" font-size="11">outlier-resistant vs. mean/SMA</text>
  <text x="150" y="248" text-anchor="middle" fill="#e1e1e1" font-size="11" font-family="Consolas, monospace">baseline = median(history)</text>

  <!-- Split arrows -->
  <line x1="260" y1="223" x2="360" y2="130" stroke="#00b0ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="260" y1="223" x2="360" y2="330" stroke="#00b0ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Branch A: RVOL -->
  <rect x="365" y="90" width="230" height="80" rx="8" fill="#1e1e1e" stroke="#333333"/>
  <text x="480" y="114" text-anchor="middle" fill="#e1e1e1" font-size="13" font-weight="700">RVOL (Relative Volume)</text>
  <text x="480" y="136" text-anchor="middle" fill="#e1e1e1" font-size="11" font-family="Consolas, monospace">rvol = V_today / baseline</text>
  <text x="480" y="154" text-anchor="middle" fill="#aaaaaa" font-size="10">e.g. 3.20 = 3.2x normal volume</text>

  <!-- Branch B: Log Z-score -->
  <rect x="365" y="290" width="230" height="95" rx="8" fill="#1e1e1e" stroke="#333333"/>
  <text x="480" y="312" text-anchor="middle" fill="#e1e1e1" font-size="13" font-weight="700">Log-Transformed Z-Score</text>
  <text x="480" y="332" text-anchor="middle" fill="#e1e1e1" font-size="10" font-family="Consolas, monospace">x = ln(1 + V)</text>
  <text x="480" y="349" text-anchor="middle" fill="#e1e1e1" font-size="10" font-family="Consolas, monospace">z = (x_today - mean(x)) / std(x)</text>
  <text x="480" y="368" text-anchor="middle" fill="#aaaaaa" font-size="10">corrects log-normal skew</text>

  <!-- Branch C: MAD modified z (informational) -->
  <line x1="260" y1="223" x2="360" y2="470" stroke="#777777" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="365" y="435" width="230" height="80" rx="8" fill="#1a1a1a" stroke="#555555" stroke-dasharray="4,3"/>
  <text x="480" y="458" text-anchor="middle" fill="#cccccc" font-size="13" font-weight="700">Modified Z-Score (MAD)</text>
  <text x="480" y="478" text-anchor="middle" fill="#cccccc" font-size="10" font-family="Consolas, monospace">0.6745 x (V-median)/MAD</text>
  <text x="480" y="496" text-anchor="middle" fill="#888888" font-size="10">informational — not gating</text>

  <!-- Arrows into threshold check -->
  <line x1="595" y1="130" x2="700" y2="220" stroke="#00b0ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="595" y1="330" x2="700" y2="260" stroke="#00b0ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Dual threshold decision -->
  <rect x="705" y="175" width="230" height="120" rx="8" fill="#1e1e1e" stroke="#00b0ff" stroke-width="2"/>
  <text x="820" y="200" text-anchor="middle" fill="#00b0ff" font-size="13" font-weight="700">Dual-Threshold Gate</text>
  <text x="820" y="224" text-anchor="middle" fill="#e1e1e1" font-size="11" font-family="Consolas, monospace">z_score &gt;= 2.5</text>
  <text x="820" y="242" text-anchor="middle" fill="#e1e1e1" font-size="11">AND</text>
  <text x="820" y="260" text-anchor="middle" fill="#e1e1e1" font-size="11" font-family="Consolas, monospace">rvol &gt;= 2.0x</text>
  <text x="820" y="280" text-anchor="middle" fill="#aaaaaa" font-size="10">both must clear to flag</text>

  <!-- Arrow to output -->
  <line x1="820" y1="295" x2="820" y2="340" stroke="#00e676" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Output -->
  <rect x="705" y="343" width="230" height="60" rx="8" fill="#122a1c" stroke="#00e676" stroke-width="2"/>
  <text x="820" y="368" text-anchor="middle" fill="#00e676" font-size="13" font-weight="700">Anomaly Flagged</text>
  <text x="820" y="386" text-anchor="middle" fill="#aaaaaa" font-size="10">logged to CSV + shown in GUI</text>

  <text x="490" y="540" text-anchor="middle" fill="#666666" font-size="11">
    Rolling 20-trading-day window · statistics computed with NumPy
  </text>
</svg>
